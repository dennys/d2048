org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Jetifier 是 AndroidX 過渡期的遺物（還要逐個改寫依賴的 bytecode），AGP 9 早已不需要；
# 開了只是白跑。與 dNeko／dHealth 一致（雨案都是 false）。
android.enableJetifier=false
# Built-in Kotlin（AGP 9 內建 Kotlin 編譯）：AGP 9 已移除「套 KGP」這條路，
# Flutter 3.44 只是給了 android.builtInKotlin=false 這個暫時逃生口，拆掉後就是 build 失敗。
# 本檔原本是 Flutter migrator 自動加的 false，2026-11-09 翻成 true（見 TODO.md）。
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
