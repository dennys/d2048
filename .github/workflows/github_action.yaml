name: d2048

on:
  push:
    branches: ["*"]
    # tags: ["v*"] # 要發正式版再打開
  pull_request:
    branches: ["*"]
  workflow_dispatch:

# 同一分支只留最新一次；PR 再推就掐掉還在跑的舊的
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 與開發機 /home/v5/flutter 同版；日後升版只改這行。
  # 這裡原本 pin 在 3.29.0，但 pubspec 的 environment.flutter 是 ">=3.47.0"
  # → `flutter pub get` 會被版本解卡死，等於 3160fe2 升級 toolchain 之後 CI 就該是紅的。
  FLUTTER_VERSION: "3.47.9"
  JAVA_VERSION: "21"

jobs:
  ci:
    name: analyze / test / build APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "gradle"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      # 原本只快取 ~/.pub-cache；Gradle 那邊每次從零抓 → 把 wrapper/dists 之外的 caches 也存起來
      - name: Cache pub and gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pubspec.lock', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install dependencies
        run: flutter pub get

      # 原本掛了 `|| true`，有 lint 問題也照樣綠燈 → 拿掉（--fatal-warnings/--fatal-infos 預設皆 on）
      - name: Analyze code
        run: flutter analyze

      # 原本整個被註解掉：470 行的棋盘逻辑等於完全沒驗
      - name: Run tests
        run: flutter test

      # 只出 arm64，與 android/app/build.gradle.kts 的 abiFilters 一致；
      # 原本 build 的是通用 APK 還加 --verbose（Logs 巨大沒意義）
      - name: Build debug APK
        run: flutter build apk --debug --target-platform android-arm64

      # 之前 CI 完全沒驗 release（AOT）→ 本地踩過的 aapt2/AOT/strip 類問題 CI 一張網都抓不到。
      # 沒有 keystore secrets 時會用 debug 簽章（見 app/build.gradle.kts），不會紅。
      # release signing: keystore and key.properties come only from GitHub secrets
      # (public repo -> nothing secret in the tree). The Gradle side already reads
      # android/app/key.properties; without this step CI always fell back to the debug
      # key that every runner regenerates -> a different signature per build, so
      # Android refuses in-place upgrades of the CI artifact.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "::warning::KEYSTORE_B64 / KEY_PROPERTIES not set, release APK will be debug-signed"
            exit 0
          fi
          # secrets 常判贴时带 \r/空白：base64 把全部空白清掉；key.properties 只去 \r（properties 内部版面有意味）
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > android/app/d2048.keystore
          printf '%s\n' "$KEY_PROPERTIES" | tr -d '\r' > android/app/key.properties
          # 四行都准都有（app/build.gradle.kts 是 getProperty 直接读，少一行拿到 null，
          # 到 :app:packageRelease 才炸難猜）；storeFile 是相对 android/app/ 的路径。
          prop(){ sed -n "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*//p" android/app/key.properties | head -1 | tr -d '\r'; }
          for k in storeFile storePassword keyAlias keyPassword; do
            test -n "$(prop "$k")" || { echo "::error::key.properties 缺 $k=（storeFile 是相对 android/app/ 的）"; exit 1; }
          done
          # 2026-11-09 换发过共用钥：旧密码曾以明文 commit 进 public repo history → 永久作废
          PW=$(prop storePassword); KP=$(prop keyPassword)
          if [ "$PW" = "iu6cv1o8k5b7re0d" ] || [ "$KP" = "iu6cv1o8k5b7re0d" ]; then
            echo "::error::用的 2026-11-09 已作过的共用钥密码（public repo history 已 leak）；再生 key 并 update both secrets"
            exit 1
          fi

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: d2048-apk-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
